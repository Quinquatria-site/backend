name: 기능 요청
description: 새로운 기능이나 기존 기능의 개선을 제안합니다.
title: "[Feature] "
body:
  - type: dropdown
    id: application
    attributes:
      label: 대상 범위
      description: 제안이 적용될 애플리케이션이나 영역을 선택해 주세요.
      options:
        - Backoffice API
        - Customer API
        - 공통 설정 또는 개발 환경
        - 여러 영역
        - 아직 정해지지 않음
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편이나 요구 사항이 있는지 설명해 주세요.
      placeholder: 사용자는 ... 때문에 ... 하기 어렵습니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작이나 구현 방향을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 이 기능이 완료되었다고 판단할 수 있는 조건을 작성해 주세요.
      placeholder: |
        - [ ] ...할 수 있다.
        - [ ] ...일 때 ...로 응답한다.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 검토한 다른 해결 방법이나 현재 사용 중인 우회 방법이 있다면 작성해 주세요.

  - type: textarea
    id: additional-context
    attributes:
      label: 추가 정보
      description: API 예시, 화면, 관련 문서나 이슈 등 참고 자료를 첨부해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 기존 이슈에 동일하거나 유사한 제안이 있는지 확인했습니다.
          required: true
