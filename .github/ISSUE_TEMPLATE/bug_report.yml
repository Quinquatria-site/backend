name: 버그 제보
description: 재현 가능한 오류나 예상과 다른 동작을 제보합니다.
title: "[Bug] "
body:
  - type: dropdown
    id: application
    attributes:
      label: 영향 범위
      description: 문제가 발생한 애플리케이션이나 영역을 선택해 주세요.
      options:
        - Backoffice API
        - Customer API
        - 공통 설정 또는 개발 환경
        - 알 수 없음
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 간단히 설명해 주세요.
      placeholder: 무엇이 잘못되었는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 다른 사람이 같은 문제를 확인할 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. ... 요청을 보냅니다.
        2. ... 조건을 설정합니다.
        3. ... 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제 결과와 오류 메시지를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 문제 확인에 필요한 환경 정보를 작성해 주세요.
      placeholder: |
        - 실행 환경: 로컬 / 개발 / 운영
        - Python 버전:
        - 요청 경로 및 메서드:
        - 관련 커밋 또는 배포 버전:

  - type: textarea
    id: logs
    attributes:
      label: 로그 및 참고 자료
      description: 민감 정보를 제거한 로그, 스크린샷, 관련 링크를 첨부해 주세요.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 기존 이슈에서 같은 문제가 보고되었는지 확인했습니다.
          required: true
        - label: 로그와 첨부 자료에서 비밀번호, 토큰 등 민감 정보를 제거했습니다.
          required: true
