[project]
name = "quinquatria-backend"
version = "0.1.0"
description = "Quinquatria backend monorepo"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.13.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-q"]
testpaths = [
    "apps/backoffice/tests",
    "apps/common/tests",
    "apps/customer/tests",
]

[tool.ruff]
target-version = "py314"
src = [
    "apps/backoffice/src",
    "apps/common/src",
    "apps/customer/src",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
