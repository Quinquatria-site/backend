[project]
name = "quinquatria-backend"
version = "0.1.0"
description = "Quinquatria backend monorepo"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "alembic>=1.17,<2",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13.0",
    "testcontainers[postgres]>=4.15,<5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-q"]
testpaths = [
    "apps/backoffice/tests",
    "apps/customer/tests",
    "packages/persistence/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
src = [
    "apps/backoffice/src",
    "apps/customer/src",
    "packages/persistence/src",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
