[project]
name = "backoffice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jiyonggg", email = "kimvergognoso21@hufs.ac.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5,<16",
    "common",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1,<1",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "quinquatria-persistence",
]

[tool.uv.sources]
common = { workspace = true }
quinquatria-persistence = { workspace = true }

[tool.fastapi]
entrypoint = "backoffice.main:app"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
